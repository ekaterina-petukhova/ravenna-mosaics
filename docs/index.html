<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Ravenna — Tessera by Tessera
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      height: 680vh;
      overflow-x: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #mosaic,
    #tessera3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #mosaic {
      z-index: 1;
    }

    #tessera3d {
      z-index: 3;
      cursor: grab;
      touch-action: pan-y;
    }

    #tessera3d.is-dragging {
      cursor: grabbing;
    }

    #tessera3d.is-hidden {
      pointer-events: none;
    }

    #bar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;

      width: 0;
      height: 2px;

      background: #d0a43c;
    }

    .brand {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 10;

      color: #cfad54;

      font:
        15px
        Georgia,
        serif;

      letter-spacing: .18em;

      pointer-events: none;
    }

    .step {
      position: absolute;
      top: 25px;
      right: 28px;
      z-index: 10;

      color: #777;

      font-size: 10px;

      letter-spacing: .22em;
      text-transform: uppercase;

      pointer-events: none;
    }

    

    #copy {
      position: absolute;
      left: 50%;
      bottom: 7vh;
      z-index: 10;

      width:
        min(
          760px,
          88vw
        );

      transform:
        translateX(-50%);

      text-align: center;

      pointer-events: none;
    }

    .kicker {
      margin-bottom: 10px;

      color: #989898;

      font-size: 10px;

      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font:
        400
        clamp(
          30px,
          4.4vw,
          60px
        ) /
        1.03
        Georgia,
        serif;

      letter-spacing: -.02em;
    }

    p {
      max-width: 620px;

      margin:
        12px
        auto
        0;

      color: #989898;

      font-size: 12px;
      line-height: 1.55;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;

      background: #000;

      color: #aaa;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;
    }

    @media (
      max-width: 700px
    ) {
      .brand {
        top: 18px;
        left: 18px;
      }

      .step {
        top: 19px;
        right: 18px;
      }

      #copy {
        bottom: 10vh;
      }
    }

    #title {
      margin: 0;

      color:
        rgba(
          255,
          255,
          255,
          0.94
        );

      /* font-family:
        "Nunito",
        sans-serif; */

      font-size:
        clamp(
          39px,
          4vw,
          60px
        );

      font-weight: 400;

      line-height: 1.1;

      letter-spacing: 0.025em;

      transition:
        opacity 0.4s ease;
    }

    #desc {
      color:  #777;;
      transform: translateY(20px);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
</script>
</head>

<body>
  <div id="stage">

    <canvas id="mosaic">
    </canvas>
    <canvas
      id="tessera3d"
      aria-label="Interactive blue glass tessera"
    ></canvas>

    <div id="bar">
    </div>

    

    

    <div id="copy">

      

      <h1 id="title">
        Every story begins with one piece of glass
      </h1>

      <p id="desc">
        Прокручивай — мозаика будет собираться
        камушек за камушком.
      </p>

    </div>

    

    <div id="loading">
      Loading…
    </div>

  </div>

  <script src="./app.js?v=14"></script>
  <script
    type="module"
    src="./tessera-3d.js?v=14"
  ></script>
</body>
</html>
